services:
  postgres:
    image: postgres:17
    container_name: kadaplatz-postgres
    environment:
      POSTGRES_DB: kadaplatz
      POSTGRES_USER: kadaplatz
      POSTGRES_PASSWORD: kadaplatz
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: